[package]
name = "switchboard-core"
version = "0.5.0"
edition = "2024"
description = "Logique partagee de Switchboard (config, process, logs) — sans UI"

[dependencies]
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
tempfile = "3.27.0"
