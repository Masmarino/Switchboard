[package]
name = "switchboard-cli"
version = "0.5.0"
edition = "2024"
description = "CLI de Switchboard : gerer et piloter les apps de lancement, sortie JSON stable pour les agents"

[[bin]]
name = "switchboard-cli"
path = "src/main.rs"

[dependencies]
switchboard-core = { path = "../core" }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
tempfile = "3.27.0"
